<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lumo — 생각보다 빠른 AI 메모 앱</title>
<style>
  :root {
    --accent: #e11d2e;
    --accent-soft: #ff4d5e;
    --ink: #ffffff;
    --muted: #a8a3a8;
    --bg: #0a0709;
    --card: rgba(255, 255, 255, 0.04);
    --line: rgba(255, 255, 255, 0.1);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    color: var(--ink);
    background: var(--bg);
    line-height: 1.6;
  }
  .wrap { max-width: 1040px; margin: 0 auto; padding: 0 24px; }
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 16px 32px;
    background: #e9e7ea;
    color: #141015;
    font-size: 16px;
    font-weight: 600;
    text-decoration: none;
    border-radius: 999px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
    transition: background .2s, transform .2s;
  }
  .btn::after { content: "→"; font-size: 15px; }
  .btn:hover { background: #fff; transform: translateY(-2px); }

  .hero {
    padding: 168px 0 148px;
    text-align: center;
    background:
      repeating-linear-gradient(
        108deg,
        transparent 0 70px,
        rgba(225, 29, 46, 0.55) 110px,
        rgba(120, 8, 22, 0.35) 150px,
        transparent 210px
      ),
      radial-gradient(ellipse at 50% 0%, rgba(255, 77, 94, 0.35) 0%, transparent 65%),
      linear-gradient(180deg, #14090d 0%, var(--bg) 100%);
  }
  .brand {
    display: inline-block;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: .12em;
    color: var(--ink);
    padding: 6px 16px;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: rgba(0, 0, 0, 0.35);
    margin-bottom: 36px;
  }
  .hero h1 { font-size: 72px; line-height: 1.15; font-weight: 800; letter-spacing: -0.035em; margin-bottom: 28px; }
  .hero p { font-size: 19px; color: #d4cfd4; margin-bottom: 52px; }

  .features { padding: 120px 0; }
  .features h2, .cta h2 { font-size: 36px; font-weight: 800; letter-spacing: -0.025em; text-align: center; margin-bottom: 64px; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 40px 32px; }
  .card .icon { font-size: 40px; margin-bottom: 20px; }
  .card h3 { font-size: 22px; margin-bottom: 12px; }
  .card p { color: var(--muted); font-size: 16px; }

  .cta {
    padding: 120px 0;
    text-align: center;
    background:
      radial-gradient(ellipse at 50% 100%, rgba(225, 29, 46, 0.45) 0%, transparent 65%),
      var(--bg);
  }
  .cta h2 { margin-bottom: 40px; }

  footer { padding: 32px 0; text-align: center; font-size: 14px; color: var(--muted); border-top: 1px solid var(--line); }

  @media (max-width: 768px) {
    .hero { padding: 104px 0 88px; }
    .hero h1 { font-size: 42px; }
    .hero p { font-size: 17px; }
    .features, .cta { padding: 72px 0; }
    .features h2, .cta h2 { font-size: 28px; margin-bottom: 40px; }
    .grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<section class="hero">
  <div class="wrap">
    <div class="brand">Lumo</div>
    <h1>생각보다 빠른<br>AI 메모 앱</h1>
    <p>떠오른 생각을 적기만 하세요.<br>정리와 요약은 Lumo가 알아서 해드립니다.</p>
    <a class="btn" href="#start">무료로 시작하기</a>
  </div>
</section>

<section class="features">
  <div class="wrap">
    <h2>메모가 달라지는 세 가지</h2>
    <div class="grid">
      <div class="card">
        <div class="icon">⚡</div>
        <h3>즉시 기록</h3>
        <p>앱을 열면 바로 입력 상태.<br>기다림 없이 생각을 붙잡아요.</p>
      </div>
      <div class="card">
        <div class="icon">✨</div>
        <h3>AI 자동 정리</h3>
        <p>흩어진 메모를 주제별로 묶고<br>핵심만 깔끔하게 요약해줘요.</p>
      </div>
      <div class="card">
        <div class="icon">🔍</div>
        <h3>똑똑한 검색</h3>
        <p>단어가 기억나지 않아도 괜찮아요.<br>뜻으로 찾아 바로 보여드려요.</p>
      </div>
    </div>
  </div>
</section>

<section class="cta" id="start">
  <div class="wrap">
    <h2>지금, 첫 메모를 남겨보세요</h2>
    <a class="btn" href="#start">무료로 시작하기</a>
  </div>
</section>

<footer>
  <div class="wrap">© 2026 Lumo. All rights reserved.</div>
</footer>

</body>
</html>
