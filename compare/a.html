<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>메모 - 홈</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --color-primary: #3182f6;
    --surface-page: #f2f4f6;
    --surface-card: #ffffff;
    --text-primary: #191f28;
    --text-secondary: #4e5968;
    --text-muted: #8b95a1;
    --text-on-primary: #ffffff;
    --label-blue-soft: #e8f3ff;
    --label-green-soft: #e3f8ec;
    --label-orange-soft: #fff1e5;
    --label-pink-soft: #ffeaf1;

    --space-4: 4px;
    --space-8: 8px;
    --space-12: 12px;
    --space-16: 16px;
    --space-20: 20px;
    --space-24: 24px;
    --space-34: 34px;
    --space-64: 64px;
    --radius-sm: 12px;
    --radius-md: 16px;
    --radius-xl: 24px;
    --radius-full: 999px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--surface-page);
    font-family: "Noto Sans KR", sans-serif;
    color: var(--text-primary);
    -webkit-font-smoothing: antialiased;
  }

  .screen {
    width: 100%;
    max-width: 390px;
    min-height: 100vh;
    min-height: 100dvh;
    margin: 0 auto;
    padding: var(--space-64) var(--space-16) 0;
    display: flex;
    flex-direction: column;
    gap: var(--space-16);
    background: var(--surface-page);
  }

  .main {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: var(--space-16);
  }

  /* Header */
  .header {
    display: flex;
    flex-direction: column;
    gap: var(--space-8);
    padding: 0 var(--space-8);
  }
  .date {
    font-size: 15px;
    font-weight: 500;
    line-height: 22px;
    letter-spacing: -0.2px;
    color: var(--text-muted);
  }
  .title {
    font-size: 28px;
    font-weight: 700;
    line-height: 38px;
    letter-spacing: -0.8px;
    word-break: keep-all;
  }
  .title em { font-style: normal; color: var(--color-primary); }

  /* Filter chips */
  .filter {
    display: flex;
    gap: var(--space-8);
    padding: 0 var(--space-4);
    overflow-x: auto;
    scrollbar-width: none;
  }
  .filter::-webkit-scrollbar { display: none; }
  .chip {
    flex-shrink: 0;
    height: 36px;
    padding: 0 var(--space-16);
    border: 0;
    border-radius: var(--radius-full);
    background: var(--surface-card);
    color: var(--text-secondary);
    font: 700 15px/22px "Noto Sans KR", sans-serif;
    letter-spacing: -0.2px;
    white-space: nowrap;
    cursor: pointer;
  }
  .chip[aria-pressed="true"] {
    background: var(--color-primary);
    color: var(--text-on-primary);
  }

  /* Card */
  .card {
    display: flex;
    flex-direction: column;
    padding: var(--space-8) 0;
    background: var(--surface-card);
    border-radius: var(--radius-xl);
  }
  .card-header {
    display: flex;
    align-items: center;
    gap: var(--space-4);
    height: 40px;
    padding: var(--space-12) var(--space-16) var(--space-4) var(--space-20);
  }
  .card-header .pin { width: 16px; height: 16px; flex-shrink: 0; display: block; }
  .card-header h2 {
    flex: 1;
    min-width: 0;
    font-size: 15px;
    font-weight: 700;
    line-height: 22px;
    letter-spacing: -0.2px;
  }
  .card-header .action {
    display: flex;
    align-items: center;
    gap: var(--space-4);
    border: 0;
    background: none;
    color: var(--text-muted);
    font: 500 15px/22px "Noto Sans KR", sans-serif;
    letter-spacing: -0.2px;
    white-space: nowrap;
    cursor: pointer;
  }
  .card-header .action img { width: 16px; height: 16px; display: block; }

  /* Memo item */
  .memo {
    display: flex;
    align-items: center;
    gap: var(--space-16);
    height: 72px;
    padding: var(--space-12) var(--space-20);
    color: inherit;
    text-decoration: none;
  }
  .tile {
    width: 44px;
    height: 44px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: var(--radius-sm);
    background: var(--label-blue-soft);
  }
  .tile.green  { background: var(--label-green-soft); }
  .tile.orange { background: var(--label-orange-soft); }
  .tile.pink   { background: var(--label-pink-soft); }
  .tile img { width: 22px; height: 22px; display: block; }
  .memo-content {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: var(--space-4);
  }
  .memo-title {
    font-size: 17px;
    font-weight: 700;
    line-height: 24px;
    letter-spacing: -0.3px;
  }
  .memo-preview {
    font-size: 14px;
    font-weight: 400;
    line-height: 20px;
    letter-spacing: -0.1px;
    color: var(--text-secondary);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .memo-date {
    flex-shrink: 0;
    font-size: 13px;
    font-weight: 500;
    line-height: 18px;
    color: var(--text-muted);
    white-space: nowrap;
  }

  /* Primary button: 화면 아래에 붙고 가로로 꽉 참 */
  .bottom {
    position: sticky;
    bottom: 0;
    padding-bottom: var(--space-34);
    background: linear-gradient(to bottom, rgba(242,244,246,0), var(--surface-page) 16px);
  }
  .btn-primary {
    width: 100%;
    height: 56px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: var(--space-8);
    padding: 0 var(--space-24);
    border: 0;
    border-radius: var(--radius-md);
    background: var(--color-primary);
    color: var(--text-on-primary);
    font: 700 17px/24px "Noto Sans KR", sans-serif;
    letter-spacing: -0.2px;
    white-space: nowrap;
    cursor: pointer;
  }
  .btn-primary img { width: 20px; height: 20px; display: block; }
</style>
</head>
<body>
  <div class="screen">
    <main class="main">
      <header class="header">
        <p class="date">10월 30일 금요일</p>
        <h1 class="title">오늘까지 메모를<br><em>128개</em> 남겼어요</h1>
      </header>

      <nav class="filter" aria-label="메모 분류">
        <button class="chip" type="button" aria-pressed="true">전체</button>
        <button class="chip" type="button" aria-pressed="false">업무</button>
        <button class="chip" type="button" aria-pressed="false">개인</button>
        <button class="chip" type="button" aria-pressed="false">아이디어</button>
      </nav>

      <section class="card" aria-labelledby="pinned-title">
        <div class="card-header">
          <img class="pin" src="assets/pin.svg" alt="">
          <h2 id="pinned-title">고정한 메모</h2>
        </div>
        <a class="memo" href="#">
          <span class="tile"><img src="assets/note-blue.svg" alt=""></span>
          <span class="memo-content">
            <span class="memo-title">디자인 리뷰 회의록</span>
            <span class="memo-preview">검수 기준과 다음 할 일 정리</span>
          </span>
          <span class="memo-date">오늘</span>
        </a>
        <a class="memo" href="#">
          <span class="tile green"><img src="assets/note-green.svg" alt=""></span>
          <span class="memo-content">
            <span class="memo-title">주말 등산 준비</span>
            <span class="memo-preview">물 두 병, 간식, 바람막이 챙기기</span>
          </span>
          <span class="memo-date">어제</span>
        </a>
      </section>

      <section class="card" aria-labelledby="recent-title">
        <div class="card-header">
          <h2 id="recent-title">최근 메모</h2>
          <button class="action" type="button">전체 보기<img src="assets/chevron-right.svg" alt=""></button>
        </div>
        <a class="memo" href="#">
          <span class="tile pink"><img src="assets/note-pink.svg" alt=""></span>
          <span class="memo-content">
            <span class="memo-title">장보기 목록</span>
            <span class="memo-preview">우유, 계란, 사과, 커피 원두, 식빵, 바나나, 요거트, 치즈, 양파, 감자, 대파, 두부, 휴지, 세제, 샴푸까지 퇴근길에 마트에 들러서 한꺼번에 사 오기</span>
          </span>
          <span class="memo-date">오늘</span>
        </a>
        <a class="memo" href="#">
          <span class="tile orange"><img src="assets/note-orange.svg" alt=""></span>
          <span class="memo-content">
            <span class="memo-title">앱 아이콘 아이디어</span>
            <span class="memo-preview">메모지 모서리가 접힌 모양</span>
          </span>
          <span class="memo-date">오늘</span>
        </a>
        <a class="memo" href="#">
          <span class="tile green"><img src="assets/note-green.svg" alt=""></span>
          <span class="memo-content">
            <span class="memo-title">읽을 책</span>
            <span class="memo-preview">디자인 시스템 책 두 권</span>
          </span>
          <span class="memo-date">어제</span>
        </a>
      </section>
    </main>

    <div class="bottom">
      <button class="btn-primary" type="button"><img src="assets/plus.svg" alt="">새 메모 쓰기</button>
    </div>
  </div>
</body>
</html>
